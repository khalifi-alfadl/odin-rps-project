<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let humanScore = 0;
      let computerScore = 0;

      function getComputerChoice() {
        let computerChoice = Math.floor(Math.random() * 3) + 1;
        let computerChoiceConverted;

        switch (computerChoice) {
          case 1:
            computerChoiceConverted = "rock";
            return computerChoiceConverted;
            break;
          case 2:
            computerChoiceConverted = "paper";
            return computerChoiceConverted;
            break;
          case 3:
            computerChoiceConverted = "scissors";
            return computerChoiceConverted;
            break;
          default:
            computerChoiceConverted = "unknown";
            console.log("Invalid selection made");
        }
      }

      function getHumanChoice(input) {
        const humanChoice = prompt("Enter input:")?.trim().toLowerCase();

        switch (humanChoice) {
          case "rock":
            return humanChoice;
            break;
          case "paper":
            return humanChoice;
            break;
          case "scissors":
            return humanChoice;
          default:
            console.log("Please enter a proper input");
        }
      }

      function playRound(humanChoice, computerChoice) {
        let winner = undefined;

        const winningMoves = {
          rock: "scissors",
          paper: "rock",
          scissors: "paper",
        };

        if (humanChoice === computerChoice) {
          return "Tie";
        } else if (winningMoves[humanChoice] === computerChoice) {
          humanScore++;
          return "Player wins";
        } else if (winningMoves[computerChoice] === humanChoice) {
          computerScore++;
          return "Computer wins";
        } else {
          return "INVALID";
        }
      }

      const humanSelection = getHumanChoice();
      const computerSelection = getComputerChoice();

      console.log(`Player choice: ${humanSelection}`);
      console.log(`Computer choice: ${computerSelection}`);
      console.log(playRound(humanSelection, computerSelection));
    </script>
  </body>
</html>
